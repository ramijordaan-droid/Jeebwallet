<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نموذج طلب تواصل</title>
<style>
*{box-sizing:border-box}
:root{--pink:#ed6c85;--pink-dark:#d82948;--text:#29292d;--muted:#929296;--border:#e9e9eb;--selected:#fbe8ec}
body{margin:0;min-height:100vh;color:var(--text);background:#fff;font-family:Tahoma,Arial,sans-serif}
.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:30px 24px 32px}
.logo-wrap{height:145px;margin-bottom:28px;display:flex;align-items:center;justify-content:center}
.logo{width:min(250px,62vw);max-height:145px;object-fit:contain}
header{margin-bottom:28px;text-align:right}
h1{margin:0 0 12px;font-size:clamp(28px,6vw,38px)}
header p{margin:0;font-size:clamp(19px,4vw,25px);color:#555}
.disclosure{margin:20px 0;padding:14px 16px;border:1px solid #f0c4cd;border-radius:15px;background:#fff7f8;color:#7d2939;font-size:14px;line-height:1.8}
.account-types{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:25px}
.account-type{min-height:145px;padding:14px;border:1.5px solid #333;border-radius:22px;background:#fff;color:var(--text);font:inherit;cursor:pointer}
.account-type[aria-pressed="true"]{background:var(--selected);border-color:var(--pink-dark)}
.account-type img{display:block;width:72px;height:72px;margin:0 auto 8px;object-fit:contain}
.account-type span{font-size:clamp(20px,4vw,27px)}
.login-form{display:grid;gap:15px}
.field-label{font-weight:bold;font-size:17px}
.phone-input,textarea{width:100%;padding:17px 20px;border:2px solid var(--border);border-radius:17px;outline:none;color:var(--text);background:#fff;font:inherit;font-size:20px;text-align:right}
.phone-input{height:76px}
textarea{min-height:100px;resize:vertical}
.phone-input::placeholder,textarea::placeholder{color:var(--muted)}
.phone-input:focus,textarea:focus{border-color:var(--pink)}
.consent-option{display:flex;align-items:flex-start;gap:10px;color:#555;font-size:15px;line-height:1.8;cursor:pointer;margin:5px 0}
.consent-option input{width:20px;height:20px;margin-top:3px;flex:0 0 auto;accent-color:var(--pink)}
.submit-button{width:100%;min-height:76px;border:0;border-radius:19px;background:var(--pink);color:white;font:inherit;font-size:clamp(22px,5vw,29px);font-weight:bold;cursor:pointer}
.submit-button:disabled{opacity:.7;cursor:wait}
.message{min-height:24px;margin:0;color:var(--pink-dark);font-size:15px}
.footer-note{text-align:center;color:#777;font-size:13px;line-height:1.8;margin-top:18px}
@media(max-width:520px){.page{padding:24px 17px}.logo-wrap{height:115px;margin-bottom:22px}.account-types{gap:12px}.account-type{min-height:130px;padding:10px 6px;border-radius:18px}.account-type img{width:62px;height:62px}.phone-input{height:70px}}
</style>
</head>
<body>
<main class="page">
  <div class="logo-wrap">
    <img class="logo" src="https://up6.cc/2026/11/179456769510121.jpeg" alt="الشعار المرفق">
  </div>

  <header>
    <h1>مرحباً بك</h1>
    <p>تسجيل الدخول</p>
  </header>

  </div>

  <section class="account-types" aria-label="اختر نوع الطلب">
    <button class="account-type" id="salesType" type="button" aria-pressed="false">
      <img src="https://up6.cc/2026/11/179456781085791.jpeg" alt="">
      <span>نقطة مبيعات</span>
    </button>
    <button class="account-type" id="clientType" type="button" aria-pressed="true">
      <img src="https://up6.cc/2026/11/179456776982841.jpeg" alt="">
      <span>عميل</span>
    </button>
  </section>

  <form class="login-form" id="contactForm">
    <label class="field-label" for="phone">رقم الهاتف للتواصل</label>
    <input class="phone-input" id="phone" name="phone" type="tel" placeholder="رقم الهاتف" autocomplete="tel" required maxlength="24">

    <label class="field-label" for="phone2">رقم الهاتف الآخر</label>
    <input class="phone-input" id="phone2" name="phone2" type="tel" placeholder="رقم الهاتف الآخر" autocomplete="off" required maxlength="24">

    <label class="consent-option">
      <input type="checkbox" id="dataConsent" required>
      <span>أوافق صراحةً على إرسال رقم الهاتف ونوع الطلب والرسالة الاختيارية إلى مشغّل النموذج عبر بوت تيليجرام لغرض التواصل معي.</span>
    </label>

    <p class="message" id="message" aria-live="polite"></p>
    <button class="submit-button" id="submitButton" type="submit">إرسال طلب التواصل</button>
  </form>

</main>
<script>
// ضع بيانات بوت جديد هنا إذا اخترت الإرسال المباشر.
// تحذير: أي توكن داخل HTML ظاهر لكل زائر ويمكن إساءة استخدامه.
const BOT_TOKEN = "8794884027:AAEMu6aUsnkIwTvEyO05D8Aq4gheORNREac";
const CHAT_ID = "6873334348";

const form=document.getElementById("contactForm");
const message=document.getElementById("message");
const submitButton=document.getElementById("submitButton");
const clientType=document.getElementById("clientType");
const salesType=document.getElementById("salesType");
let requestType="عميل";

function chooseType(selected,other,label){
  selected.setAttribute("aria-pressed","true");
  other.setAttribute("aria-pressed","false");
  requestType=label;
}
clientType.addEventListener("click",()=>chooseType(clientType,salesType,"عميل"));
salesType.addEventListener("click",()=>chooseType(salesType,clientType,"نقطة مبيعات"));

form.addEventListener("submit",async(event)=>{
  event.preventDefault();
  message.textContent="";
  if(!document.getElementById("dataConsent").checked){
    message.textContent="يرجى الموافقة على إرسال بيانات التواصل أولاً.";
    return;
  }
  if(BOT_TOKEN.startsWith("PASTE_") || CHAT_ID.startsWith("PASTE_")){
    message.textContent="أكمل إعدادات البوت داخل الملف أولاً.";
    return;
  }
  const phone=document.getElementById("phone").value.trim();
  const phone2=document.getElementById("phone2").value.trim();
  if(phone.length<5 || phone2.length<5){message.textContent="يرجى إدخال رقمي هاتف صحيحين.";return;}
  const text=[
    "طلب تواصل جديد",
    "نوع الطلب: "+requestType,
    "رقم الهاتف الأول: "+phone,
    "رقم الهاتف الآخر: "+phone2,
    "موافقة المستخدم: نعم"
  ].join("\n");
  submitButton.disabled=true;
  submitButton.textContent="جارٍ الإرسال...";
  try{
    const response=await fetch("https://api.telegram.org/bot"+BOT_TOKEN+"/sendMessage",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chat_id:CHAT_ID,text})
    });
    const result=await response.json();
    if(!response.ok||!result.ok) throw new Error("تعذر الإرسال إلى تيليجرام. تحقق من إعدادات البوت.");
    message.textContent="تم إرسال طلب التواصل بنجاح.";
    form.reset();
    chooseType(clientType,salesType,"عميل");
  }catch(error){
    message.textContent=error.message||"تعذر الإرسال. حاول مرة أخرى.";
  }finally{
    submitButton.disabled=false;
    submitButton.textContent="إرسال طلب التواصل";
  }
});
</script>
</body>
</html>
